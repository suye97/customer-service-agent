# 商品智能客服子路径配置。
# 将以下内容放入现有站点的 server { } 中，不要作为独立 nginx 配置直接加载。
# 访问：https://<YOUR_DOMAIN>/customer-service-agent/
# 后端：127.0.0.1:8001；前端目录：/data/projects/customer-service-agent/web/

# 必须补尾斜杠，否则浏览器会把相对资源与 API 路径解析到错误位置。
location = /customer-service-agent {
    return 301 /customer-service-agent/;
}

# API：剥离 /customer-service-agent 前缀，转发到后端 /api/...。
location /customer-service-agent/api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# index.html 使用 static/... 相对路径；这里将该前缀映射回 web/ 下的真实文件。
# 例如 /customer-service-agent/static/app.js -> web/app.js。
location /customer-service-agent/static/ {
    alias /data/projects/customer-service-agent/web/;
}

# HTML 由 nginx 直接提供；无前端路由，不需要 try_files。
location /customer-service-agent/ {
    alias /data/projects/customer-service-agent/web/;
    index index.html;
}
