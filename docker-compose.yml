name: customer-service-agent

services:
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: customer-service-agent:${APP_VERSION:-latest}
    container_name: customer-service-agent
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # 仅当 Milvus 在 Docker 宿主机上且已监听宿主机可达地址时启用：
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
